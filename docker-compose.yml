services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - student-service-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - student-service-network

  registration-service-db:
    image: postgres:16-alpine
    container_name: registration-service-db
    environment:
      POSTGRES_DB: registration_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - registration_service_db_data:/var/lib/postgresql/data
    networks:
      - student-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registration_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  registration-processor-db:
    image: postgres:16-alpine
    container_name: registration-processor-db
    environment:
      POSTGRES_DB: registration_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - registration_processor_db_data:/var/lib/postgresql/data
    networks:
      - student-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registration_processor"]
      interval: 5s
      timeout: 5s
      retries: 5

  registration-service:
    build:
      context: .
      dockerfile: registration-service/Dockerfile
    container_name: registration-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://registration-service-db:5432/registration_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      registration-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - student-service-network
    restart: on-failure

  registration-processor:
    build:
      context: .
      dockerfile: registration-processor/Dockerfile
    container_name: registration-processor
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://registration-processor-db:5432/registration_processor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      registration-processor-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - student-service-network
    restart: on-failure

volumes:
  kafka_data:
  registration_service_db_data:
  registration_processor_db_data:

networks:
  student-service-network:
    driver: bridge
