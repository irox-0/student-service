spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      group-id: registration-processor-group
    bootstrap-servers: localhost:9092
  liquibase:
    change-log: classpath:/db/changelog/data/initial-data.yml
    enabled: true
server:
  port: 8081

teacher-not-found: NOT_FOUND